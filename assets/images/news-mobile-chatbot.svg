<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c3545" />
      <stop offset="100%" stop-color="#12151c" />
    </radialGradient>

    <!-- Steel Gradient for Large Gear -->
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d5df" />
      <stop offset="40%" stop-color="#8b93a4" />
      <stop offset="80%" stop-color="#505766" />
      <stop offset="100%" stop-color="#2f3542" />
    </linearGradient>

    <!-- Bronze Gradient for Small Gear -->
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc875" />
      <stop offset="40%" stop-color="#e08936" />
      <stop offset="80%" stop-color="#a34914" />
      <stop offset="100%" stop-color="#5e2405" />
    </linearGradient>

    <!-- Chrome Gradient for Tools -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#aab0bc" />
      <stop offset="50%" stop-color="#eef1f5" />
      <stop offset="75%" stop-color="#7a8191" />
      <stop offset="100%" stop-color="#d0d5df" />
    </linearGradient>

    <!-- Red Handle Gradient for Screwdriver -->
    <linearGradient id="red-handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#9b2226" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glow Filter for Sparks -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gear Teeth Paths -->
    <path id="l-tooth" d="M -16,-135 L 16,-135 L 22,-100 L -22,-100 Z" />
    <path id="s-tooth" d="M -14,-92 L 14,-92 L 18,-65 L -18,-65 Z" />

    <!-- Large Gear Teeth Group -->
    <g id="large-gear-teeth">
      <use href="#l-tooth" transform="rotate(0)" />
      <use href="#l-tooth" transform="rotate(30)" />
      <use href="#l-tooth" transform="rotate(60)" />
      <use href="#l-tooth" transform="rotate(90)" />
      <use href="#l-tooth" transform="rotate(120)" />
      <use href="#l-tooth" transform="rotate(150)" />
      <use href="#l-tooth" transform="rotate(180)" />
      <use href="#l-tooth" transform="rotate(210)" />
      <use href="#l-tooth" transform="rotate(240)" />
      <use href="#l-tooth" transform="rotate(270)" />
      <use href="#l-tooth" transform="rotate(300)" />
      <use href="#l-tooth" transform="rotate(330)" />
    </g>

    <!-- Small Gear Teeth Group -->
    <g id="small-gear-teeth">
      <use href="#s-tooth" transform="rotate(0)" />
      <use href="#s-tooth" transform="rotate(45)" />
      <use href="#s-tooth" transform="rotate(90)" />
      <use href="#s-tooth" transform="rotate(135)" />
      <use href="#s-tooth" transform="rotate(180)" />
      <use href="#s-tooth" transform="rotate(225)" />
      <use href="#s-tooth" transform="rotate(270)" />
      <use href="#s-tooth" transform="rotate(315)" />
    </g>

    <!-- Large Gear Mask -->
    <mask id="large-gear-mask">
      <g fill="white">
        <circle cx="0" cy="0" r="120" />
        <use href="#large-gear-teeth" />
      </g>
      <circle cx="0" cy="0" r="95" fill="black" />
      <circle cx="0" cy="0" r="45" fill="white" />
      <rect x="-12" y="-95" width="24" height="190" fill="white" transform="rotate(0)" />
      <rect x="-12" y="-95" width="24" height="190" fill="white" transform="rotate(60)" />
      <rect x="-12" y="-95" width="24" height="190" fill="white" transform="rotate(120)" />
      <circle cx="0" cy="0" r="20" fill="black" />
    </mask>

    <!-- Small Gear Mask -->
    <mask id="small-gear-mask">
      <g fill="white">
        <circle cx="0" cy="0" r="78" />
        <use href="#small-gear-teeth" />
      </g>
      <circle cx="0" cy="0" r="55" fill="black" />
      <circle cx="0" cy="0" r="30" fill="white" />
      <rect x="-10" y="-55" width="20" height="110" fill="white" transform="rotate(0)" />
      <rect x="-10" y="-55" width="20" height="110" fill="white" transform="rotate(90)" />
      <circle cx="0" cy="0" r="14" fill="black" />
      <rect x="-4" y="-18" width="8" height="10" fill="black" />
    </mask>

    <!-- Wrench Mask -->
    <mask id="wrench-mask">
      <rect x="-12" y="-125" width="24" height="250" rx="4" fill="white" />
      <circle cx="0" cy="-145" r="32" fill="white" />
      <circle cx="0" cy="145" r="28" fill="white" />
      <rect x="-12" y="-180" width="24" height="45" fill="black" />
      <polygon points="0,129 13.8,137 13.8,153 0,161 -13.8,153 -13.8,137" fill="black" />
    </mask>

    <!-- Screwdriver Handle Mask -->
    <mask id="handle-mask">
      <path d="M -10, 90 L 10, 90 L 16, 115 L 14, 165 A 14 14 0 0 1 -14, 165 L -16, 115 Z" fill="white" />
    </mask>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Blueprint / Technical Lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="220" y1="0" x2="220" y2="512" />
    <line x1="0" y1="220" x2="512" y2="220" />
    <circle cx="220" cy="220" r="198" fill="none" />
    <circle cx="220" cy="220" r="150" fill="none" stroke-dasharray="4 4" />
    <line x1="360" y1="0" x2="360" y2="512" />
    <line x1="0" y1="360" x2="512" y2="360" />
    <circle cx="360" cy="360" r="100" fill="none" stroke-dasharray="4 4" />
  </g>

  <!-- Inner shadow for background depth -->
  <rect width="512" height="512" fill="none" stroke="#000000" stroke-width="12" opacity="0.4" />

  <!-- Large Gear (Steel) -->
  <g transform="translate(220, 220)" filter="url(#drop-shadow)">
    <rect x="-140" y="-140" width="280" height="280" fill="url(#steel)" mask="url(#large-gear-mask)" />
    <!-- 3D Bevels -->
    <circle cx="0" cy="0" r="119" stroke="#ffffff" stroke-width="1.5" opacity="0.5" fill="none" />
    <circle cx="0" cy="0" r="96" stroke="#1a1c23" stroke-width="2" opacity="0.6" fill="none" />
    <circle cx="0" cy="0" r="44" stroke="#ffffff" stroke-width="1.5" opacity="0.4" fill="none" />
    <circle cx="0" cy="0" r="21" stroke="#1a1c23" stroke-width="2" opacity="0.6" fill="none" />
  </g>

  <!-- Small Gear (Bronze) -->
  <g transform="translate(360, 360)" filter="url(#drop-shadow)">
    <rect x="-100" y="-100" width="200" height="200" fill="url(#bronze)" mask="url(#small-gear-mask)" />
    <!-- 3D Bevels -->
    <circle cx="0" cy="0" r="77" stroke="#ffffff" stroke-width="1.5" opacity="0.5" fill="none" />
    <circle cx="0" cy="0" r="56" stroke="#5e2405" stroke-width="2" opacity="0.6" fill="none" />
    <circle cx="0" cy="0" r="29" stroke="#ffffff" stroke-width="1.5" opacity="0.4" fill="none" />
    <circle cx="0" cy="0" r="15" stroke="#5e2405" stroke-width="2" opacity="0.6" fill="none" />
  </g>

  <!-- Sparks / Glowing Particles -->
  <g filter="url(#glow)">
    <circle cx="290" cy="290" r="3" fill="#ffcf70" />
    <circle cx="305" cy="280" r="2" fill="#ffffff" />
    <circle cx="280" cy="305" r="2.5" fill="#ffcf70" />
    <circle cx="315" cy="300" r="1.5" fill="#ffffff" />
    <circle cx="295" cy="315" r="2" fill="#e08936" />
  </g>

  <!-- Wrench -->
  <g transform="translate(256, 256) rotate(45) scale(1.2)" filter="url(#drop-shadow)">
    <rect x="-40" y="-180" width="80" height="360" fill="url(#chrome)" mask="url(#wrench-mask)" />
    <!-- Wrench Details & Bevels -->
    <rect x="-11" y="-124" width="22" height="248" rx="3" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <rect x="-4" y="-90" width="8" height="180" rx="4" fill="#1a1c23" opacity="0.4" />
    <rect x="-4" y="-89" width="8" height="180" rx="4" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  </g>

  <!-- Screwdriver -->
  <g transform="translate(256, 256) rotate(-45) scale(1.2)" filter="url(#drop-shadow)">
    <!-- Shaft -->
    <rect x="-4" y="-50" width="8" height="130" fill="url(#chrome)" />
    <rect x="-2" y="-50" width="2" height="130" fill="#ffffff" opacity="0.6" />
    
    <!-- Tip -->
    <path d="M -4,-50 L -2,-80 L 2,-80 L 4,-50 Z" fill="url(#chrome)" />
    <path d="M -2,-50 L -1,-80 L 0,-80 L 0,-50 Z" fill="#ffffff" opacity="0.6" />
    <line x1="-4" y1="-50" x2="4" y2="-50" stroke="#1a1c23" stroke-width="1" opacity="0.5" />
    
    <!-- Bolster -->
    <rect x="-10" y="80" width="20" height="10" rx="2" fill="url(#chrome)" />
    <rect x="-10" y="82" width="20" height="2" fill="#ffffff" opacity="0.5" />
    
    <!-- Handle Base -->
    <path d="M -10, 90 L 10, 90 L 16, 115 L 14, 165 A 14 14 0 0 1 -14, 165 L -16, 115 Z" fill="url(#red-handle)" />
    
    <!-- Handle Highlights & Shadows -->
    <rect x="-20" y="90" width="20" height="100" fill="#ffffff" opacity="0.25" mask="url(#handle-mask)" />
    <rect x="0" y="90" width="20" height="100" fill="#000000" opacity="0.25" mask="url(#handle-mask)" />
    
    <!-- Handle Grips -->
    <rect x="-8" y="105" width="3" height="55" rx="1.5" fill="#111111" opacity="0.5" />
    <rect x="-1.5" y="105" width="3" height="55" rx="1.5" fill="#111111" opacity="0.5" />
    <rect x="5" y="105" width="3" height="55" rx="1.5" fill="#111111" opacity="0.5" />
  </g>
</svg>